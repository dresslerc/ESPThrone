select:
  - platform: template
    name: "Water Temperature"
    id: eplo_water_temperature
    icon: mdi:thermometer-water
    optimistic: true
    restore_value: false

    options:
      - "Off"
      - "86°F"
      - "90°F"
      - "93°F"
      - "96°F"
      - "99°F"

    set_action:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            // EPLO E18 - Water Temperature
            // 48 data bits plus leader and trailing pair
            std::string bits;
            
            if (x == "90°F") {
              bits = "000010100001000000000100000000000000000000100000";
            }
            else if (x == "93°F") {
              bits = "000010100001000000001100000000000000000010100000";
            }
            else if (x == "96°F") {
              bits = "000010100001000000000010000000000000000000100000";
            }
            else if (x == "99°F") {
              bits = "000010100001000000001010000000000000000010100000";
            }
            else if (x == "Off") {
              bits = "000010100001000000000000000000000000000011000000";
            }
            else if (x == "86°F") {
              bits = "000010100001000000001000000000000000000000100000";
            }
            else {
              return std::string("");
            }

            // Pronto header: 38 kHz, 50 pairs
            std::string pronto =
                "0000 006D 0032 0000 0158 00AE";

            for (char bit : bits) {
              pronto += (bit == '1')
                  ? " 0015 0042"
                  : " 0015 0017";
            }

            // Final timing pair
            pronto += " 0158 0180";

            return pronto;

          repeat:
            times: 3
            wait_time: 140ms

  - platform: template
    name: "Seat Temperature"
    id: eplo_seat_temperature
    icon: mdi:car-seat-heater
    optimistic: true
    restore_value: false

    options:
      - "Off"
      - "86°F"
      - "90°F"
      - "93°F"
      - "96°F"
      - "99°F"

    set_action:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            std::string bits;

            if (x == "Off") {
              bits = "000010101001000000000000000000000000000000100000";
            }
            else if (x == "86°F") {
              bits = "000010101001000000001000000000000000000010100000";
            }
            else if (x == "90°F") {
              bits = "000010101001000000000100000000000000000010100000";
            }
            else if (x == "93°F") {
              bits = "000010101001000000001100000000000000000001100000";
            }
            else if (x == "96°F") {
              bits = "000010101001000000000010000000000000000010100000";
            }
            else if (x == "99°F") {
              bits = "000010101001000000001010000000000000000001100000";
            }
            else {
              return std::string("");
            }

            std::string pronto = "0000 006D 0032 0000 0158 00AE";

            for (char bit : bits) {
              pronto += (bit == '1')
                  ? " 0015 0042"
                  : " 0015 0017";
            }

            pronto += " 0158 0180";
            return pronto;

          repeat:
            times: 3
            wait_time: 140ms
            
  - platform: template
    name: "Dryer Level"
    id: eplo_dryer_level
    icon: mdi:fan
    optimistic: true
    restore_value: false

    options:
      - "0"
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

    set_action:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            // EPLO E18 Dryer - 6 levels (0 through 5)
            std::string bits;

            if (x == "0") {
              bits = "000010101100000001000000000000000000000010100000";
            }
            else if (x == "1") {
              bits = "000010101100000001001000000000000000000001100000";
            }
            else if (x == "2") {
              bits = "000010101100000001000100000000000000000001100000";
            }
            else if (x == "3") {
              bits = "000010101100000001001100000000000000000011100000";
            }
            else if (x == "4") {
              bits = "000010101100000001000010000000000000000001100000";
            }
            else if (x == "5") {
              bits = "000010101100000001001010000000000000000011100000";
            }
            else {
              return std::string("");
            }

            // Pronto header: 38 kHz, 50 timing pairs
            std::string pronto = "0000 006D 0032 0000 0158 00AE";

            for (char bit : bits) {
              pronto += (bit == '1')
                  ? " 0015 0042"
                  : " 0015 0017";
            }

            pronto += " 0158 0180";
            return pronto;

          repeat:
            times: 3
            wait_time: 140ms


  - platform: template
    name: "Spray Position"
    id: eplo_spray_position
    icon: mdi:arrow-up-down
    optimistic: true
    restore_value: false

    options:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

    set_action:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            // EPLO E18 Spray Position
            // Five positions, decoded from original IR captures
            std::string bits;

            if (x == "1") {
              bits = "000010100110000000001000000000000000000010100000";
            }
            else if (x == "2") {
              bits = "000010100110000000000100000000000000000010100000";
            }
            else if (x == "3") {
              bits = "000010100110000000001100000000000000000001100000";
            }
            else if (x == "4") {
              bits = "000010100110000000000010000000000000000010100000";
            }
            else if (x == "5") {
              bits = "000010100110000000001010000000000000000001100000";
            }
            else {
              return std::string("");
            }

            // Standard EPLO E18 Pronto frame
            // 1 leader + 48 data bits + 1 trailer = 50 pairs
            std::string pronto = "0000 006D 0032 0000 0158 00AE";

            for (char bit : bits) {
              pronto += (bit == '1')
                  ? " 0015 0042"
                  : " 0015 0017";
            }

            pronto += " 0158 0180";
            return pronto;

          repeat:
            times: 3
            wait_time: 140ms

  - platform: template
    name: "pray Pressure"
    id: eplo_spray_pressure
    icon: mdi:water
    optimistic: true
    restore_value: false

    options:
      - "Level 1"
      - "Level 2"
      - "Level 3"

    set_action:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            std::string pronto = "0000 006D 0032 0000 0158 00AE";

            for (int i = 1; i <= 48; i++) {
              bool bit = (i == 5 || i == 7 || i == 11);

              if (x == "Level 1") {
                if (i == 21 || i == 43)
                  bit = true;
              }
              else if (x == "Level 2") {
                if (i == 22 || i == 43)
                  bit = true;
              }
              else if (x == "Level 3") {
                if (i == 21 || i == 22 ||
                    i == 43 || i == 44)
                  bit = true;
              }

              pronto += bit ? " 0015 0042" : " 0015 0017";
            }

            pronto += " 0158 0180";
            return pronto;

          repeat:
            times: 3
            wait_time: 140ms            
 
