button:
  - platform: template
    name: "Automatic Night Light"
    id: eplo_e18_automatic_night_light
    icon: mdi:lightbulb-night

    on_press:
      - remote_transmitter.transmit_pronto:
          data: !lambda |-
            std::string pronto = "0000 006D 0032 0000 0158 00AE";

            for (int i = 1; i <= 48; i++) {
              bool bit = (
                i == 5  ||
                i == 7  ||
                i == 9  ||
                i == 11 ||
                i == 13 ||
                i == 41 ||
                i == 43
              );

              pronto += bit ? " 0015 0042" : " 0015 0017";
            }

            pronto += " 0158 0180";
            return pronto;

          repeat:
            times: 3
            wait_time: 140ms
            
